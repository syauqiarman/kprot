<!DOCTYPE html>
<html>
<head>
    <title>SSO Error</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-lg shadow-md max-w-lg w-full">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-red-600 mb-4">Koneksi SSO Gagal</h1>
            <p class="text-gray-600 mb-4">{{ error_message }}</p>
        </div>

        <div class="mb-6">
            <h2 class="font-semibold text-gray-700 mb-2">Langkah Troubleshooting:</h2>
            <ul class="list-disc pl-5 space-y-2 text-gray-600">
                {% for step in troubleshooting_steps %}
                    <li>{{ step }}</li>
                {% endfor %}
            </ul>
        </div>

        <div class="flex justify-center">
            <a href="{% url 'dashboard:dashboard' %}" 
               class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700">
                Kembali ke Dashboard
            </a>
        </div>
    </div>
</body>
</html>
